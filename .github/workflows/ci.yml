name: CI

# The Mac runner may lag the local Xcode; the project was built with Xcode 26.6
# (macOS 26.5 SDK). The step below picks the newest Xcode 26 on the runner.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Lint · Typecheck · Test · Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - run: brew install xcodegen

      - name: Lint
        run: bash Scripts/lint.sh

      - name: Typecheck
        run: swift build --package-path Packages/StoreSimKit

      - name: Test
        run: swift test --package-path Packages/StoreSimKit

      - name: Build (Mac and iPhone simulator)
        run: bash Scripts/build.sh
